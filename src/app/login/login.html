<div class="min-h-screen flex items-center justify-center bg-rose-50 p-4 font-sans text-right" dir="rtl">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border-t-4 border-rose-400">
    
    <h1 class="text-3xl font-bold text-rose-900 mb-2 tracking-wide">مرحباً بكِ</h1>
    <p class="text-rose-600 mb-8 text-sm">متى بدأت حكايتنا؟</p>

    <div class="mb-6">
      <input 
        type="date" 
        [(ngModel)]="secretDate"
        class="w-full p-3 border-2 border-rose-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-400 text-rose-900 transition-all text-center">
    </div>

    <button 
      (click)="onLogin()"
      class="w-full bg-rose-400 hover:bg-rose-500 text-white font-bold py-3 px-4 rounded-xl transition-colors duration-300 shadow-md active:scale-95">
      دخول
    </button>

    <div *ngIf="errorMessage" class="mt-4 text-red-500 text-sm animate-pulse">
      التاريخ غير صحيح، حاول مرة أخرى ❤️
    </div>

  </div>
</div>
